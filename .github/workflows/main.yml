name: CI/CD

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    lint-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up UV
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version-file: tasks-api/pyproject.toml

            - name: Install dependencies
              run: |
                  uv sync --all-extras --dev
              working-directory: tasks-api

            - name: Run Ruff checks
              uses: astral-sh/ruff-action@v4.1.0
              with:
                  args: "check --fix"

            - name: Run Ruff format check
              uses: astral-sh/ruff-action@v4.1.0
              with:
                  args: "format --check"

            - name: Run Type Checking (Mypy)
              run: |
                  uv run mypy tasks-api/

            - name: Run Tests
              run: |
                  uv run pytest --cov=tasks-api/ --cov-report=term-missing
